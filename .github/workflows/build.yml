name: Build Ibn Ezz POS Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # إذا كان لديك ملف مكتبات requirements.txt قم بإلغاء التهميش عن السطر التالي:
          # pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          # استبدل src/main.py بمسار ملفك الفعلي (مثلاً: app/main.py أو src/app.py)
          pyinstaller --noconfirm --onedir --windowed --name "IbnEzz_POS" src/main.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IbnEzz_POS_Windows
          path: dist/IbnEzz_POS
          
